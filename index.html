<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毛小孩の家 - 寵物美容工作室</title>
  <style>
    :root {
      --primary: #f6ad55;
      --primary-dark: #dd6b20;
      --primary-light: #fffaf0;
      --bg: #f7fafc;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-color: #edf2f7;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      line-height: 1.7;
      color: var(--text-main);
      background-color: var(--bg);
      padding: 0 0 60px 0;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 頂部 Header & 關於我們 */
    header {
      background: linear-gradient(135deg, #fbd38d 0%, #f6ad55 100%);
      color: #744210;
      padding: 48px 20px 40px;
      text-align: center;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      box-shadow: 0 4px 20px rgba(246, 173, 85, 0.25);
      margin-bottom: 36px;
    }

    .shop-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.85);
      color: #9c4221;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    h1.shop-title {
      font-size: 2.5rem;
      margin-bottom: 16px;
      color: #5f370e;
      letter-spacing: 1px;
    }

    .intro-box {
      background: #ffffff;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 28px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      text-align: left;
      color: var(--text-main);
    }

    .intro-box p {
      font-size: 1.05rem;
      margin-bottom: 14px;
      color: #4a5568;
    }

    .intro-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }

    .tag {
      background: #feebc8;
      color: #7b341e;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .info-list {
      border-top: 1px dashed #e2e8f0;
      padding-top: 16px;
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .info-item {
      display: flex;
      align-items: center;
      font-size: 0.98rem;
    }

    .info-item .icon {
      font-size: 1.2rem;
      margin-right: 8px;
    }

    .info-item strong {
      color: #2d3748;
      margin-right: 4px;
    }

    /* 區塊標題 */
    .section-title {
      font-size: 1.6rem;
      color: #2d3748;
      text-align: center;
      margin: 40px 0 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .section-title::after {
      content: "";
      position: absolute;
      bottom: -8px;
      width: 48px;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* 中間部分：價目表與作品照 */
    .middle-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .img-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #edf2f7;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .img-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 12px;
      transition: transform 0.25s ease;
    }

    .img-wrapper img:hover {
      transform: scale(1.02);
    }

    /* 下方部分：衛教卡（美容後照護） */
    .bottom-section {
      margin-top: 10px;
    }

    .care-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      max-width: 850px;
      margin: 0 auto;
    }

    /* 頁尾 */
    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 50px;
    }

    /* RWD 手機版響應式設計 */
    @media (max-width: 768px) {
      header {
        padding: 32px 16px 28px;
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
      }

      h1.shop-title {
        font-size: 1.85rem;
      }

      .intro-box {
        padding: 18px 20px;
      }

      .info-list {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .middle-section {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .section-title {
        font-size: 1.4rem;
        margin: 32px 0 20px;
      }

      .care-card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- 最上方：店名與店家資訊 -->
  <header>
    <div class="container">
      <span class="shop-badge">🐾 寵物美容工作室</span>
      <h1 class="shop-title">毛小孩の家</h1>

      <div class="intro-box">
        <p>我們是一間開在住宅區的小型寵物美容工作室，<strong>一次只接一隻，不關籠、不趕時間</strong>。怕生、年紀大、第一次美容的毛孩，都可以慢慢來放鬆享受。</p>

        <div class="intro-tags">
          <span class="tag">🎯 服務對象：小型犬、中大型犬、貓</span>
          <span class="tag">✨ 一對一專屬美容</span>
          <span class="tag">📷 過程拍照即時回報飼主</span>
        </div>

        <div class="info-list">
          <div class="info-item">
            <span class="icon">🕒</span>
            <div><strong>營業時間：</strong>週二至週日 10:00–19:00（週一公休）</div>
          </div>
          <div class="info-item">
            <span class="icon">📞</span>
            <div><strong>預約電話：</strong><a href="tel:0900000000" style="color: var(--primary-dark); text-decoration: none; font-weight: bold;">0900-000-000</a></div>
          </div>
          <div class="info-item">
            <span class="icon">💬</span>
            <div><strong>LINE 預約：</strong><span style="color: #2b6cb0; font-weight: 500;">@maoxiaohai</span></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 中間：價目表與美容作品照 -->
    <h2 class="section-title">💈 服務項目與成果</h2>
    <div class="middle-section">
      <!-- 價目表 -->
      <section class="card">
        <h3 class="card-title">📋 服務價目表</h3>
        <div class="img-wrapper">
          <img src="price.png" alt="毛小孩の家 - 服務價目表" loading="lazy">
        </div>
      </section>

      <!-- 作品照 -->
      <section class="card">
        <h3 class="card-title">✨ 美容作品照</h3>
        <div class="img-wrapper">
          <img src="photo.png" alt="毛小孩の家 - 美容作品照" loading="lazy">
        </div>
      </section>
    </div>

    <!-- 下面：美容後照護（衛教卡） -->
    <h2 class="section-title">🩺 美容後照護</h2>
    <div class="bottom-section">
      <section class="care-card">
        <div class="img-wrapper">
          <img src="care.png" alt="毛小孩の家 - 美容後照護衛教卡" loading="lazy">
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>© 毛小孩の家 Pet Grooming Studio ｜ 守護每個毛孩的快樂與舒適</p>
  </footer>

</body>
</html>
